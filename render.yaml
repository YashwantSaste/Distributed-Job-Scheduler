databases:
  - name: scheduler-db
    databaseName: scheduler
    user: scheduler

envGroups:
  - name: shared-config
    envVars:
      - key: DB_URL
        fromDatabase:
          name: scheduler-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: scheduler-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scheduler-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: scheduler-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: scheduler-redis
          property: port
      - key: KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: scheduler-kafka
          property: hostport

services:
  - type: pserv
    name: scheduler-kafka
    env: docker
    image: bitnami/kafka:3.7.0
    envVars:
      - key: PORT
        value: "9092"
      - key: KAFKA_KRAFT_CLUSTER_ID
        value: "MkU3OEVBNTcwNTJENDM2Qk"
      - key: KAFKA_ENABLE_KRAFT
        value: "yes"
      - key: KAFKA_CFG_NODE_ID
        value: "1"
      - key: KAFKA_CFG_PROCESS_ROLES
        value: "broker,controller"
      - key: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
        value: "1@127.0.0.1:9093"
      - key: KAFKA_CFG_LISTENERS
        value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093"
      - key: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      - key: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
        value: "CONTROLLER"
      - key: ALLOW_PLAINTEXT_LISTENER
        value: "yes"
    disk:
      name: kafka-data
      mountPath: /bitnami/kafka
      sizeGB: 1

  - type: redis
    name: scheduler-redis
    ipAllowList: []

  - type: web
    name: api-server
    env: docker
    dockerfilePath: docker/Dockerfile.jvm
    dockerContext: .
    dockerBuildArgs:
      MODULE: api-server
      MAIN_CLASS: com.project.scheduler.api.ApiServerApplication
    envVars:
      - key: PORT
        value: "8080"
      - key: HTTP_PORT
        value: "8080"
    envGroups:
      - shared-config

  - type: worker
    name: consumer-service
    env: docker
    dockerfilePath: docker/Dockerfile.jvm
    dockerContext: .
    dockerBuildArgs:
      MODULE: consumer-service
      MAIN_CLASS: com.project.scheduler.consumer.ConsumerApplication
    envGroups:
      - shared-config

  - type: worker
    name: executor-service
    env: docker
    dockerfilePath: docker/Dockerfile.jvm
    dockerContext: .
    dockerBuildArgs:
      MODULE: executor-service
      MAIN_CLASS: com.project.scheduler.executor.ExecutorApplication
    envGroups:
      - shared-config

  - type: worker
    name: watcher-service
    env: docker
    dockerfilePath: docker/Dockerfile.jvm
    dockerContext: .
    dockerBuildArgs:
      MODULE: watcher-service
      MAIN_CLASS: com.project.scheduler.watcher.WatcherApplication
    envGroups:
      - shared-config
